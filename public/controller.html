<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<title>Table Tennis Controller</title>
<style>
  :root { --bg:#10243a; --card:#1b3552; --ink:#f2f7fc; --dim:#9db4cb; --accent:#37a0ff; --ok:#3ddc84; --warn:#ffb14a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); gap:14px; }
  .screen.on { display:flex; }
  h1 { margin:6px 0 0; font-size:26px; } p { margin:0; color:var(--dim); line-height:1.45; }
  input[type=text] { font:inherit; font-size:18px; padding:14px; border-radius:14px; border:2px solid #2c4d70; background:#0c1b2c; color:var(--ink); width:100%; }
  .seg { display:flex; background:#0c1b2c; border-radius:14px; padding:4px; gap:4px; }
  .seg button { flex:1; padding:12px; border:0; border-radius:10px; font:inherit; font-weight:700; background:transparent; color:var(--dim); }
  .seg button.on { background:var(--accent); color:#04121f; }
  .big { font:inherit; font-size:22px; font-weight:800; padding:20px; border:0; border-radius:18px; background:var(--accent); color:#04121f; width:100%; }
  .big.alt { background:#2a4766; color:var(--ink); font-size:16px; padding:14px; }
  .big:active { transform:scale(.98); }
  #pill { align-self:flex-start; padding:4px 12px; border-radius:99px; font-size:13px; font-weight:700; background:#27425f; color:var(--dim); }
  #pill.ok { background:#12402a; color:var(--ok); } #pill.bad { background:#4a2a14; color:var(--warn); }
  #score { display:flex; justify-content:center; align-items:center; gap:14px; font-size:64px; font-weight:800; line-height:1; margin-top:2px; }
  #score small { font-size:18px; color:var(--dim); font-weight:600; display:block; text-align:center; }
  #score div { text-align:center; } #score .me b { color:var(--accent); } #score .sep { font-size:36px; color:var(--dim); }
  #status { font-size:28px; font-weight:800; text-align:center; min-height:76px; display:flex; align-items:center; justify-content:center; line-height:1.15; }
  #fb { text-align:center; font-size:22px; font-weight:800; height:30px; color:var(--ok); }
  #meter { height:18px; background:#0c1b2c; border-radius:9px; overflow:hidden; } #meter i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--ok)); transition:width .08s; }
  #pad { flex:1; border-radius:24px; background:var(--card); border:2px dashed #35577d; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--dim); font-size:15px; }
  #pad.flash { background:#245b45; }
  .row { display:flex; gap:10px; }
  .warn { color:var(--warn); }
</style>
</head>
<body>
<div class="screen on" id="join">
  <h1>Table Tennis</h1>
  <p>Your phone is the paddle. Hold it like a Wii Remote pointed at the screen and swing.</p>
  <input type="text" id="name" maxlength="14" placeholder="Your name" autocomplete="off">
  <div><p style="margin-bottom:6px">Which hand holds the phone?</p>
    <div class="seg" id="handseg"><button data-h="1" class="on">Right</button><button data-h="-1">Left</button></div></div>
  <p id="sensorinfo"></p>
  <div style="flex:1"></div>
  <button class="big" id="joinbtn">Join &amp; enable motion</button>
  <button class="big alt" id="nomotion">Join without motion (swipe mode)</button>
</div>

<div class="screen" id="play">
  <div class="row" style="justify-content:space-between;align-items:center"><span id="pill">connecting</span><span id="seatlabel" style="color:var(--dim);font-weight:700"></span></div>
  <div id="score"><div class="me" id="sc0"><small id="nm0"></small><b id="v0">0</b></div><span class="sep">:</span><div id="sc1"><small id="nm1"></small><b id="v1">0</b></div></div>
  <div id="status">Waiting...</div>
  <div id="fb"></div>
  <div id="meter"><i></i></div>
  <div id="pad">Swing the phone!<br>(no motion sensor? swipe here: left/right = forehand/backhand, up = toss)</div>
  <div class="row">
    <button class="big alt" id="recenter">Calibrate</button>
    <button class="big alt" id="toss">Toss</button>
    <button class="big alt" id="startbtn" style="display:none">Start</button>
  </div>
  <div class="row" style="align-items:center;gap:12px"><span style="color:var(--dim);font-weight:700;font-size:14px">Sensitivity</span><input type="range" id="sens" min="0.5" max="1.6" step="0.05" value="1" style="flex:1"></div>
  <div class="row"><button class="big alt" id="flip" style="font-size:14px;padding:10px">Aim direction: flipped</button></div>
  <div class="row"><div class="seg" id="handseg2" style="flex:1"><button data-h="1" class="on">Right-hand</button><button data-h="-1">Left-hand</button></div></div>
</div>
<div class="screen" id="calib" style="background:#10243aee;z-index:5;justify-content:center;text-align:center">
  <h1 id="ctitle">Calibrate</h1>
  <p id="ctext" style="font-size:19px;color:var(--ink)"></p>
  <div id="cart" style="font-size:90px">📱</div>
  <button class="big" id="cnext">Aimed at the screen</button>
  <button class="big alt" id="cskip">Skip</button>
</div>
<script src="/controller.js"></script>
</body>
</html>
